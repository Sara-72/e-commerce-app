<section class="container py-5">
  <h2 class="text-main fw-bold mb-4">All Products</h2>

  <div class="row g-4">
    @for (product of (products$ | async); track product._id) {
      <div class="col-md-3 col-sm-6">
        <div class="product p-3 h-100 d-flex flex-column justify-content-between">
          <div>
            <img
              [src]="product.imageCover"
              [alt]="product.title"
              class="w-100 object-fit-cover rounded"
              height="240"
            />
            <span class="text-main font-sm fw-semibold mt-2 d-block">
              {{ product.category.name }}
            </span>
            <h3 class="h6 fw-bold mt-1 text-truncate" [title]="product.title">
              {{ product.title }}
            </h3>
          </div>

          <div class="mt-3">
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold">{{ product.price }} EGP</span>
              <span class="font-sm">
                <i class="fa-solid fa-star rating-color"></i> {{ product.ratingsAverage }}
              </span>
            </div>
            <button class="btn bg-main text-white w-100 mt-3">+ Add To Cart</button>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted mt-2">Loading products...</p>
      </div>
    }
  </div>
</section>
